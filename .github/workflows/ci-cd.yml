name: Flask CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 913436626979.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: flask-practice
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI: mongodb://localhost:27017/test_student_db

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest -v


  # ============================================================
  # 2. BUILD + PUSH + DEPLOY
  # ============================================================
  deploy:
    name: Build → ECR → EC2
    needs: test
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Docker Build
      # --------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            --provenance=false \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .


      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "913436626979"


      # --------------------------------------------------------
      # Verify AWS authentication
      # --------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------------
      # ECR Login
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"


      # --------------------------------------------------------
      # Push image
      #
      # ECR repository is IMMUTABLE.
      #
      # If this SHA already exists, skip the push.
      # --------------------------------------------------------
      - name: Push image to ECR
        run: |

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1
          then

            echo "Image already exists:"
            echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            echo "Skipping push because ECR tags are immutable."

          else

            echo "Image does not exist."
            echo "Pushing image..."

            docker push \
              "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          fi


      # --------------------------------------------------------
      # Prepare SSH key
      # --------------------------------------------------------
      - name: Prepare EC2 SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ec2_key"
          chmod 600 "$RUNNER_TEMP/ec2_key"


      # --------------------------------------------------------
      # Deploy to EC2
      # --------------------------------------------------------
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          MONGO_URI: ${{ secrets.MONGO_URI }}

        run: |

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Deploying image:"
          echo "$IMAGE"

          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -i "$RUNNER_TEMP/ec2_key" \
            "$EC2_USER@$EC2_HOST" \
            bash -s -- "$IMAGE" "$MONGO_URI" <<'REMOTE_SCRIPT'

          set -e

          IMAGE="$1"
          MONGO_URI="$2"

          echo "========================================"
          echo "EC2 Deployment"
          echo "========================================"

          echo "Logging into ECR..."

          aws ecr get-login-password \
            --region ap-south-1 \
            | docker login \
              --username AWS \
              --password-stdin \
              913436626979.dkr.ecr.ap-south-1.amazonaws.com


          echo "Pulling image..."

          docker pull "$IMAGE"


          echo "Creating Docker network..."

          docker network inspect flask-network \
            >/dev/null 2>&1 || \
            docker network create flask-network


          echo "Checking MongoDB container..."

          if docker ps --format '{{.Names}}' | grep -qx 'flask-mongodb'
          then

            echo "MongoDB is already running."

          elif docker ps -a --format '{{.Names}}' | grep -qx 'flask-mongodb'
          then

            echo "Starting existing MongoDB container."

            docker start flask-mongodb

          else

            echo "Creating MongoDB container."

            docker run -d \
              --name flask-mongodb \
              --network flask-network \
              --restart unless-stopped \
              mongo:8

          fi


          echo "Connecting MongoDB to network..."

          docker network connect \
            flask-network \
            flask-mongodb \
            2>/dev/null || true


          echo "Stopping existing Flask container..."

          docker stop flask-app 2>/dev/null || true


          echo "Removing existing Flask container..."

          docker rm flask-app 2>/dev/null || true


          echo "Starting new Flask container..."

          docker run -d \
            --name flask-app \
            --network flask-network \
            --restart unless-stopped \
            -p 5000:5000 \
            -e MONGO_URI="$MONGO_URI" \
            "$IMAGE"


          echo "========================================"
          echo "Deployment completed"
          echo "========================================"

          echo "Running containers:"

          docker ps

          REMOTE_SCRIPT


      # --------------------------------------------------------
      # Health Check
      # --------------------------------------------------------
      - name: Verify deployment health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}

        run: |

          echo "Waiting for Flask application..."

          for i in {1..12}
          do

            echo "Health check attempt $i..."

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "http://$EC2_HOST:5000/health"
            then

              echo
              echo "Health check PASSED."
              exit 0

            fi

            echo "Application not ready."
            sleep 5

          done

          echo "Health check FAILED."
          exit 1


      # --------------------------------------------------------
      # Success Email
      # --------------------------------------------------------
      - name: Send success notification
        if: success()
        uses: dawidd6/action-send-mail@v6

        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "SUCCESS - Flask CI/CD deployment"

          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}

          body: |
            Flask CI/CD deployment succeeded.

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Docker image:
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

            EC2 deployment:
            SUCCESS

            Health check:
            PASSED


      # --------------------------------------------------------
      # Failure Email
      # --------------------------------------------------------
      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v6

        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "FAILED - Flask CI/CD pipeline"

          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}

          body: |
            Flask CI/CD pipeline FAILED.

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Please open GitHub Actions
            and inspect the failed stage.