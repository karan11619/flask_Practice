name: Flask CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "913436626979"
  ECR_REGISTRY: 913436626979.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: flask-practice
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI: mongodb://localhost:27017/test_student_db

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest -v


  # ============================================================
  # 2. BUILD + ECR + DEPLOY
  # ============================================================
  deploy:
    name: Build → ECR → EC2
    needs: test
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================
      - name: Checkout source code
        uses: actions/checkout@v6


      # ========================================================
      # DOCKER BUILD
      # ========================================================
      - name: Build Docker image
        run: |
          docker build \
            --provenance=false \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .


      # ========================================================
      # AWS OIDC
      # ========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}


      # ========================================================
      # VERIFY AWS
      # ========================================================
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ========================================================
      # ECR LOGIN
      # ========================================================
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin \
              "$ECR_REGISTRY"


      # ========================================================
      # PUSH TO ECR
      #
      # Repository uses IMMUTABLE tags.
      #
      # If this Git SHA already exists, don't push again.
      # ========================================================
      - name: Push image to ECR
        run: |

          echo "Checking whether image already exists..."

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1
          then

            echo "Image already exists:"
            echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            echo "Skipping push because ECR tags are immutable."

          else

            echo "Image does not exist."
            echo "Pushing image to ECR..."

            docker push \
              "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          fi


      # ========================================================
      # PREPARE SSH KEY
      # ========================================================
      - name: Prepare EC2 SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

        run: |
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ec2_key"
          chmod 600 "$RUNNER_TEMP/ec2_key"


      # ========================================================
      # DEPLOY TO EC2
      # ========================================================
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          MONGO_URI: ${{ secrets.MONGO_URI }}

        run: |

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "========================================"
          echo "Deploying Flask application"
          echo "========================================"

          echo "Image:"
          echo "$IMAGE"

          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -i "$RUNNER_TEMP/ec2_key" \
            "$EC2_USER@$EC2_HOST" \
            bash -s -- "$IMAGE" "$MONGO_URI" <<'REMOTE_SCRIPT'

          set -e

          IMAGE="$1"
          MONGO_URI="$2"

          echo "========================================"
          echo "EC2 Deployment Started"
          echo "========================================"

          echo "Checking Docker..."

          docker --version

          echo "Checking AWS identity..."

          aws sts get-caller-identity


          # ======================================================
          # ECR LOGIN
          # ======================================================

          echo "Logging in to Amazon ECR..."

          aws ecr get-login-password \
            --region ap-south-1 \
            | docker login \
              --username AWS \
              --password-stdin \
              913436626979.dkr.ecr.ap-south-1.amazonaws.com


          # ======================================================
          # PULL NEW IMAGE
          # ======================================================

          echo "Pulling image..."

          docker pull "$IMAGE"


          # ======================================================
          # CREATE DOCKER NETWORK
          # ======================================================

          echo "Checking Docker network..."

          if ! docker network inspect flask-network >/dev/null 2>&1
          then
            echo "Creating flask-network..."

            docker network create flask-network
          else
            echo "flask-network already exists."
          fi


          # ======================================================
          # MONGODB
          # ======================================================

          echo "Checking MongoDB container..."

          if docker ps --format '{{.Names}}' | grep -qx 'flask-mongodb'
          then

            echo "MongoDB container is already running."

          elif docker ps -a --format '{{.Names}}' | grep -qx 'flask-mongodb'
          then

            echo "MongoDB container exists but is stopped."

            docker start flask-mongodb

          else

            echo "MongoDB container does not exist."

            echo "Creating MongoDB container..."

            docker run -d \
              --name flask-mongodb \
              --network flask-network \
              --restart unless-stopped \
              mongo:8

          fi


          # ======================================================
          # CONNECT MONGODB TO NETWORK
          # ======================================================

          echo "Connecting MongoDB to flask-network..."

          docker network connect \
            flask-network \
            flask-mongodb \
            2>/dev/null || true


          # ======================================================
          # STOP OLD FLASK
          # ======================================================

          echo "Stopping existing Flask container..."

          docker stop flask-app 2>/dev/null || true


          # ======================================================
          # REMOVE OLD FLASK
          # ======================================================

          echo "Removing existing Flask container..."

          docker rm flask-app 2>/dev/null || true


          # ======================================================
          # START NEW FLASK
          # ======================================================

          echo "Starting new Flask container..."

          docker run -d \
            --name flask-app \
            --network flask-network \
            --restart unless-stopped \
            -p 5000:5000 \
            -e MONGO_URI="$MONGO_URI" \
            "$IMAGE"


          # ======================================================
          # SHOW CONTAINERS
          # ======================================================

          echo "========================================"
          echo "Running containers"
          echo "========================================"

          docker ps


          echo "========================================"
          echo "EC2 Deployment Completed"
          echo "========================================"

          REMOTE_SCRIPT


      # ========================================================
      # HEALTH CHECK
      #
      # IMPORTANT:
      # Run health check INSIDE EC2.
      #
      # This avoids depending on GitHub runner -> port 5000.
      # ========================================================
      - name: Verify deployment health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

        run: |

          echo "========================================"
          echo "Running Flask health check on EC2"
          echo "========================================"

          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -i "$RUNNER_TEMP/ec2_key" \
            "$EC2_USER@$EC2_HOST" \
            bash -s <<'REMOTE_HEALTH_CHECK'

          set -e

          echo "Waiting for Flask application..."

          for i in {1..12}
          do

            echo "Health check attempt $i..."

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              http://localhost:5000/health
            then

              echo
              echo "========================================"
              echo "HEALTH CHECK PASSED"
              echo "========================================"

              exit 0

            fi

            echo "Application not ready."

            sleep 5

          done

          echo
          echo "========================================"
          echo "HEALTH CHECK FAILED"
          echo "========================================"

          docker ps
          docker logs --tail 100 flask-app

          exit 1

          REMOTE_HEALTH_CHECK


      # ========================================================
      # SUCCESS EMAIL
      # ========================================================
      - name: Send success notification
        if: success()
        uses: dawidd6/action-send-mail@v6

        with:

          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "SUCCESS - Flask CI/CD deployment"

          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}

          body: |
            Flask CI/CD deployment succeeded.

            ========================================

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Docker Image:
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

            EC2 Deployment:
            SUCCESS

            Health Check:
            PASSED

            ========================================

            Deployment completed successfully.


      # ========================================================
      # FAILURE EMAIL
      # ========================================================
      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v6

        with:

          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "FAILED - Flask CI/CD pipeline"

          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}

          body: |
            Flask CI/CD pipeline FAILED.

            ========================================

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Docker Image:
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

            Status:
            FAILED

            ========================================

            Please open GitHub Actions and inspect
            the failed stage.